spring:
  application:
    name: candidate-service

  datasource:
    url: jdbc:postgresql://localhost:5432/candidate_service
    username: candidate
    password: candidate

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: candidate-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: kg.tunduk.cvscan.candidate.dto.event
        spring.json.value.default.type: kg.tunduk.cvscan.candidate.dto.event.CvParsedEvent
        spring.json.use.type.headers: false
    producer:
      # key/value serializers are wired programmatically in KafkaProducerConfig
      # (using the application's own ObjectMapper), not via these properties.
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      cv-parsed: cv.parsed
      status-changed: candidate.status.changed

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    kg.tunduk.cvscan.candidate: INFO
